name: Offline regression checks

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check parsers, compiler, and frontend
        run: python tools/check.py
