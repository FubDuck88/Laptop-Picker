<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="maintenance-version" content="6r-maintenance-v1">
  <title>Catalog refresh in progress · Laptop Picker</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; color: #192a29; background: #f4f5ef; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; padding: clamp(24px, 6vw, 72px); display: grid; grid-template-rows: auto 1fr auto; gap: 48px; }
    header { font-size: 18px; font-weight: 700; letter-spacing: -.03em; }
    main { align-self: center; max-width: 660px; padding-block: 24px; }
    .status { color: #356358; font-size: 14px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
    h1 { font-size: clamp(36px, 7vw, 64px); line-height: 1.08; font-weight: 650; letter-spacing: -.045em; margin: 20px 0 24px; text-wrap: balance; }
    p { font-size: 18px; line-height: 1.65; max-width: 48ch; }
    footer { font-size: 14px; line-height: 1.6; color: #4a5b57; max-width: 60ch; }
    @media (prefers-color-scheme: dark) {
      :root { color: #edf2e9; background: #15221f; }
      .status { color: #b7d8c5; } footer { color: #bdc8bf; }
    }
  </style>
</head>
<body>
  <header>Laptop Picker</header>
  <main id="main">
    <div class="status">Catalog maintenance</div>
    <h1>Catalog refresh in progress.</h1>
    <p>Current prices are unavailable; please check sellers directly.</p>
    <p>We’re checking the catalog before bringing laptop comparisons back online.</p>
  </main>
  <footer>Laptop Picker helps you research laptops. Purchases are made directly with sellers.</footer>
</body>
</html>
